<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingbell Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"></script>
  <style>
    body { background: #f7f9fb; }
    .container { max-width: 900px; margin-top: 40px; }
    .card { border-radius: 12px; }
    h2 { font-weight: 600; text-align: center; margin-bottom: 20px; color: #0d6efd; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🏠 Kingbell Admin Dashboard</h2>

    <!-- LOGIN -->
    <div id="loginCard" class="card p-4 shadow-sm">
      <h5>Login to Continue</h5>
      <form id="loginForm">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" id="email" class="form-control" required placeholder="Enter your email" />
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="d-none">
      <div class="card p-4 mb-4 shadow-sm">
        <h5>Add New Property</h5>
        <form id="propertyForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Property Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Price per Night</label>
              <input type="number" id="price_per_night" class="form-control" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Location</label>
              <input type="text" id="location" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Property Type</label>
              <input type="text" id="propertyType" class="form-control" placeholder="e.g. Apartment, Villa">
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label>Bedrooms</label>
              <input type="number" id="Bedroom" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label>Bathrooms</label>
              <input type="number" id="bathroom" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label>Price (Text)</label>
              <input type="text" id="Price" class="form-control" placeholder="e.g. $1200/month">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>House size</label>
              <input type="text" id="House_size" class="form-control" placeholder="e.g. 2000 sqft">
            </div>
            <div class="col-md-6 mb-3">
              <label>Land size</label>
              <input type="text" id="Land_size" class="form-control" placeholder="e.g. 0.5 acre">
            </div>
          </div>

          <div class="mb-3">
            <label>Image URL</label>
            <input type="url" id="image_url" class="form-control" placeholder="https://..." required>
          </div>

          <div class="mb-3">
            <label>Description</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-success w-100">Upload Property</button>
        </form>
      </div>

      <div class="card p-4 shadow-sm">
        <h5>Existing Properties</h5>
        <table class="table table-striped" id="propertyTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Location</th>
              <th>Price/Night</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://kefkeuwjiawwcokgzmad.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZmtldXdqaWF3d2Nva2d6bWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0NTkyMTUsImV4cCI6MjA3MjAzNTIxNX0.5gsbRMoE2XrKi5ezvXoZv9oq_T4SJuESbYVkxrOpvx0";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");

    // LOGIN
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("Login failed: " + error.message);
      } else {
        alert("✅ Logged in!");
        loginCard.classList.add("d-none");
        dashboard.classList.remove("d-none");
        loadProperties();
      }
    });

    // PROPERTY UPLOAD
    document.getElementById("propertyForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        price_per_night: parseFloat(document.getElementById("price_per_night").value),
        location: document.getElementById("location").value,
        propertyType: document.getElementById("propertyType").value,
        Bedroom: parseInt(document.getElementById("Bedroom").value) || null,
        bathroom: parseInt(document.getElementById("bathroom").value) || null,
        Price: document.getElementById("Price").value,
        "House size": document.getElementById("House_size").value,
        "Land size": document.getElementById("Land_size").value,
        image_url: document.getElementById("image_url").value,
        description: document.getElementById("description").value,
      };

      const { error } = await supabase.from("properties_data").insert([data]);

      if (error) {
        alert("❌ Upload error: " + error.message);
        console.error(error);
      } else {
        alert("✅ Property uploaded!");
        e.target.reset();
        loadProperties();
      }
    });

    // LOAD PROPERTIES
    async function loadProperties() {
      const { data, error } = await supabase
        .from("properties_data")
        .select("id, name, location, price_per_night")
        .order("id", { ascending: false });

      if (error) {
        console.error("Error fetching:", error.message);
        return;
      }

      const tableBody = document.querySelector("#propertyTable tbody");
      tableBody.innerHTML = data
        .map(
          (p) => `
          <tr>
            <td>${p.id}</td>
            <td>${p.name || ""}</td>
            <td>${p.location || ""}</td>
            <td>${p.price_per_night || ""}</td>
          </tr>`
        )
        .join("");
    }
  </script>
</body>
</html>
