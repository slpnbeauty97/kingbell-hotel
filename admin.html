<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingbell Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-top: 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #555;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 15px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4a90e2;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #357ABD;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kingbell Property Upload</h1>

    <form id="propertyForm">
      <label>Property Name</label>
      <input type="text" id="name" required />

      <label>Price</label>
      <input type="text" id="Price" required />

      <label>Property Type</label>
      <input type="text" id="propertyType" />

      <label>Location</label>
      <input type="text" id="location" />

      <label>Bedrooms</label>
      <input type="number" id="Bedroom" />

      <label>Bathrooms</label>
      <input type="number" id="bathroom" />

      <label>House Size</label>
      <input type="text" id="house_size" />

      <label>Land Size</label>
      <input type="text" id="land_size" />

      <label>Price Per Night</label>
      <input type="number" id="price_per_night" />

      <label>Image URL</label>
      <input type="text" id="image_url" />

      <label>Description</label>
      <textarea id="description"></textarea>

      <label>Category</label>
      <input type="text" id="category" />

      <button type="submit">Upload Property</button>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://kefkeuwjiawwcokgzmad.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZmtldXdqaWF3d2Nva2d6bWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0NTkyMTUsImV4cCI6MjA3MjAzNTIxNX0.5gsbRMoE2XrKi5ezvXoZv9oq_T4SJuESbYVkxrOpvx0';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('propertyForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const property = {
        name: document.getElementById('name').value,
        Price: document.getElementById('Price').value,
        propertyType: document.getElementById('propertyType').value,
        location: document.getElementById('location').value,
        Bedroom: document.getElementById('Bedroom').value,
        bathroom: document.getElementById('bathroom').value,
        house_size: document.getElementById('house_size').value,
        land_size: document.getElementById('land_size').value,
        price_per_night: document.getElementById('price_per_night').value,
        image_url: document.getElementById('image_url').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
      };

      const { error } = await supabase.from('properties_data').insert([property]);

      if (error) {
        messageDiv.style.color = 'red';
        messageDiv.textContent = '❌ Error uploading: ' + error.message;
      } else {
        messageDiv.style.color = 'green';
        messageDiv.textContent = '✅ Property uploaded successfully!';
        form.reset();
      }
    });
  </script>
</body>
</html>
