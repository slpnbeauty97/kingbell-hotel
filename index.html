<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kingbell | Book Your Stay</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --kingbell-red: #c1121f;
      --kingbell-dark: #1a1a1a;
      --kingbell-gray: #f5f5f5;
    }

    body {
      background-color: var(--kingbell-gray);
      font-family: 'Poppins', sans-serif;
      color: var(--kingbell-dark);
      margin: 0;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    header .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--kingbell-red);
    }

    header .search-bar {
      flex: 1;
      margin: 0 30px;
      display: flex;
      align-items: center;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    .search-bar button {
      padding: 10px 15px;
      background-color: var(--kingbell-red);
      color: white;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-bar button:hover {
      background-color: #a30e18;
    }

    .icons {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 20px;
      color: #555;
    }

    /* Sidebar */
    nav.sidebar {
      position: fixed;
      top: 70px;
      left: 0;
      height: 100%;
      width: 80px;
      background-color: var(--kingbell-red);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    nav.sidebar ul {
      list-style: none;
      padding: 0;
    }

    nav.sidebar li {
      color: white;
      margin: 25px 0;
      font-size: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    nav.sidebar li:hover {
      transform: scale(1.1);
    }

    /* Main */
    main {
      margin-left: 100px;
      padding: 40px;
    }

    h2 {
      color: var(--kingbell-dark);
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Category pills */
    .categories ul {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .categories li {
      background: white;
      border-radius: 30px;
      padding: 8px 18px;
      font-weight: 500;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .categories li:hover {
      background: var(--kingbell-red);
      color: white;
      border-color: var(--kingbell-red);
    }

    /* Cards Grid */
    .card {
      border: none;
      border-radius: 15px;
      overflow: hidden;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .card img {
      height: 200px;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card-body h5 {
      font-weight: 600;
      font-size: 18px;
    }

    .card-body p {
      font-size: 15px;
    }

    .btn-primary {
      background: var(--kingbell-red);
      border: none;
      width: 100%;
      transition: background 0.3s;
    }

    .btn-primary:hover {
      background: #a30e18;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      background: #fff;
      color: #777;
      border-top: 1px solid #eee;
    }

    /* Responsive */
    @media (max-width: 768px) {
      main {
        margin-left: 0;
        padding: 20px;
      }

      nav.sidebar {
        display: none;
      }

      header {
        flex-wrap: wrap;
        gap: 10px;
      }

      .search-bar {
        width: 100%;
        margin: 10px 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">The Kingbell</div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search hotels, villas, or apartments...">
      <button id="searchButton"><i class="fas fa-search"></i></button>
    </div>

    <div class="icons">
      <i class="fas fa-comment"></i>
      <i class="fas fa-bell"></i>
      <i class="fas fa-user-circle"></i>
    </div>
  </header>

  <nav class="sidebar">
    <ul>
      <li><i class="fas fa-home"></i></li>
      <li><i class="fas fa-search"></i></li>
      <li><i class="fas fa-wallet"></i></li>
      <li><i class="fas fa-question-circle"></i></li>
    </ul>
  </nav>

  <main>
    <section class="categories">
      <h2>Categories</h2>
      <ul>
        <li>Hotel</li>
        <li>Motel</li>
        <li>Resort</li>
        <li>Villa</li>
        <li>Apartment</li>
        <li>Guest House</li>
      </ul>
    </section>

    <section class="recommendations mt-5">
      <h2>Recommended For You</h2>
      <div class="container mt-3">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="properties"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 The Kingbell. All Rights Reserved.</p>
  </footer>

  <!-- Supabase Logic -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

    const supabaseUrl = "https://kefkeuwjiawwcokgzmad.supabase.co"
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZmtldXdqaWF3d2Nva2d6bWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0NTkyMTUsImV4cCI6MjA3MjAzNTIxNX0.5gsbRMoE2XrKi5ezvXoZv9oq_T4SJuESbYVkxrOpvx0"
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function loadProperties() {
      const { data, error } = await supabase.from("properties_data").select("*")
      if (error) {
        console.error("Error fetching properties:", error.message)
        return
      }

      const container = document.getElementById("properties")
      container.innerHTML = ""

      data.forEach(p => {
        container.innerHTML += `
          <div class="col">
            <div class="card h-100">
              <img src="${p.image_url || 'https://via.placeholder.com/400x250'}" alt="${p.name}">
              <div class="card-body">
                <h5>${p.name}</h5>
                <p class="text-muted">${p.location}</p>
                <p class="fw-bold text-danger">$${p.price_per_night || 0} / night</p>
                <button class="btn btn-primary" onclick="alert('Booking feature coming soon!')">
                  Book Now
                </button>
              </div>
            </div>
          </div>
        `
      })
    }

    window.onload = loadProperties
  </script>
</body>
</html>
